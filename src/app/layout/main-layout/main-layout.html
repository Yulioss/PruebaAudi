<mat-sidenav-container class="sidenav-container">

  <mat-sidenav
    #sidenav
    mode="side"
    [opened]="sidenavOpened"
    class="sidenav">

    <div class="logo">
      <mat-icon>school</mat-icon>

      <span>Sistema Académico</span>
    </div>

    <mat-nav-list>

      <a
        mat-list-item
        routerLink="/students"
        routerLinkActive="active">

        <mat-icon matListItemIcon>
          person
        </mat-icon>

        <span matListItemTitle>
          Estudiantes
        </span>

      </a>

      <a
        mat-list-item
        routerLink="/teachers"
        routerLinkActive="active">

        <mat-icon matListItemIcon>
          school
        </mat-icon>

        <span matListItemTitle>
          Profesores
        </span>

      </a>

      <a
        mat-list-item
        routerLink="/notes"
        routerLinkActive="active">

        <mat-icon matListItemIcon>
          description
        </mat-icon>

        <span matListItemTitle>
          Notas
        </span>

      </a>
      <a
        mat-list-item
        routerLink="/dashboard"
        routerLinkActive="active">

        <mat-icon matListItemIcon>
          dashboard
        </mat-icon>

        <span matListItemTitle>
          Dashboard
        </span>

      </a>

    </mat-nav-list>

  </mat-sidenav>


  <mat-sidenav-content>

    <mat-toolbar class="toolbar">

      <button
        mat-icon-button
        (click)="toggleMenu()">

        <mat-icon>
          menu
        </mat-icon>

      </button>

      <span class="toolbar-title">
        Sistema Académico
      </span>

      <span class="toolbar-spacer"></span>

      <button mat-icon-button>
        <mat-icon>
          account_circle
        </mat-icon>
      </button>

    </mat-toolbar>


    <main class="content">

      <router-outlet></router-outlet>

    </main>

  </mat-sidenav-content>

</mat-sidenav-container>
