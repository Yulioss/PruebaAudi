<div class="form-container">

  <div class="form-header">

    <div>

      <h1>
        {{ isEditMode
          ? 'Editar profesor'
          : 'Nuevo profesor'
        }}
      </h1>

      <p>
        {{ isEditMode
          ? 'Modifica la información del profesor'
          : 'Registra un nuevo profesor'
        }}
      </p>

    </div>

  </div>

  @if (loading) {

    <div class="loading">

      <mat-spinner diameter="40"></mat-spinner>

      <span>
        Cargando profesor...
      </span>

    </div>

  } @else {

    <form
      class="teacher-form"
      (ngSubmit)="save()">

      <mat-form-field
        appearance="outline"
        class="full-width">

        <mat-label>
          Nombre
        </mat-label>

        <input
          matInput
          type="text"
          name="name"
          [(ngModel)]="name"
          placeholder="Ingrese el nombre"
          maxlength="50"
          autocomplete="off">


      </mat-form-field>

      @if (errorMessage) {

        <div class="error-message">
          {{ errorMessage }}
        </div>

      }

      <div class="form-actions">

        <button
          mat-stroked-button
          type="button"
          (click)="cancel()"
          [disabled]="saving">

          Cancelar

        </button>

        <button
          mat-flat-button
          color="primary"
          type="submit"
          [disabled]="saving">

          @if (saving) {

            Guardando...

          } @else {

            {{ isEditMode
              ? 'Actualizar'
              : 'Guardar'
            }}

          }

        </button>

      </div>

    </form>

  }

</div>
